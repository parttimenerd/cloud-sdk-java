name: "test-order: Three-Tier CI"

# Three-tier test ordering for the connectivity-destination-service module.
#   Tier 1: change-affected tests — every PR and push (seconds)
#   Tier 2: broader coverage      — push to main only (minutes)
#   Tier 3: remaining tests       — nightly, after tiers 1+2
#
# NOTE: Demo fork for SAP DCOM 2026 "You Are Running the Wrong Tests First".

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 2 * * *"   # nightly for tier 3
  workflow_dispatch:

env:
  MODULE: cloudplatform/connectivity-destination-service
  PLUGIN_VERSION: 0.0.1-SNAPSHOT
  MVN_ARGS: --batch-mode --no-transfer-progress -DskipFormatting -Denforcer.skip

permissions:
  contents: read
  actions: read

jobs:

  # ── Tier 1: download index (or learn locally) + run affected tests ───────────
  tier-1:
    name: "Tier 1 — Affected Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Enable test-order plugin in pom.xml
        run: |
          perl -i -pe '
            if (/^\s+<plugins>\s*$/ && !$done) {
              $_ .= "                <!-- test-order-plugin-start -->\n"
                   . "                <plugin>\n"
                   . "                        <groupId>me.bechberger</groupId>\n"
                   . "                        <artifactId>test-order-maven-plugin</artifactId>\n"
                   . "                        <version>'"$PLUGIN_VERSION"'</version>\n"
                   . "                        <executions>\n"
                   . "                                <execution>\n"
                   . "                                        <goals><goal>prepare</goal></goals>\n"
                   . "                                </execution>\n"
                   . "                        </executions>\n"
                   . "                </plugin>\n"
                   . "                <!-- test-order-plugin-end -->\n";
              $done = 1;
            }
          ' $MODULE/pom.xml

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download learn index (or fall back to local learn pass)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn $MVN_ARGS test-order:download -pl $MODULE \
            -Dtestorder.download.fallbackToLearn=true

      - name: Run tier 1 (affected tests) — writes tier 2+3 files
        run: mvn $MVN_ARGS test-order:tiered-select test -pl $MODULE

      - name: Aggregate learn data (no-op if index was downloaded)
        run: mvn $MVN_ARGS test-order:aggregate -pl $MODULE

      - name: Upload tier files for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: |
            ${{ env.MODULE }}/target/test-order-tier2.txt
            ${{ env.MODULE }}/target/test-order-tier3.txt
          retention-days: 1

  # ── Tier 2: broader coverage (push to main only) ─────────────────────────────
  tier-2:
    name: "Tier 2 — Broader Coverage"
    needs: tier-1
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Enable test-order plugin in pom.xml
        run: |
          perl -i -pe '
            if (/^\s+<plugins>\s*$/ && !$done) {
              $_ .= "                <!-- test-order-plugin-start -->\n"
                   . "                <plugin>\n"
                   . "                        <groupId>me.bechberger</groupId>\n"
                   . "                        <artifactId>test-order-maven-plugin</artifactId>\n"
                   . "                        <version>'"$PLUGIN_VERSION"'</version>\n"
                   . "                        <executions>\n"
                   . "                                <execution>\n"
                   . "                                        <goals><goal>prepare</goal></goals>\n"
                   . "                                </execution>\n"
                   . "                        </executions>\n"
                   . "                </plugin>\n"
                   . "                <!-- test-order-plugin-end -->\n";
              $done = 1;
            }
          ' $MODULE/pom.xml

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download tier files from tier 1
        uses: actions/download-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: ${{ env.MODULE }}/target/

      - name: Run tier 2 (broader coverage)
        run: mvn $MVN_ARGS test-order:run-tier test -pl $MODULE -Dtestorder.tiered.currentTier=2

  # ── Tier 3: remaining tests (nightly, after tiers 1+2) ───────────────────────
  tier-3:
    name: "Tier 3 — Remaining Tests"
    needs: tier-2
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Enable test-order plugin in pom.xml
        run: |
          perl -i -pe '
            if (/^\s+<plugins>\s*$/ && !$done) {
              $_ .= "                <!-- test-order-plugin-start -->\n"
                   . "                <plugin>\n"
                   . "                        <groupId>me.bechberger</groupId>\n"
                   . "                        <artifactId>test-order-maven-plugin</artifactId>\n"
                   . "                        <version>'"$PLUGIN_VERSION"'</version>\n"
                   . "                        <executions>\n"
                   . "                                <execution>\n"
                   . "                                        <goals><goal>prepare</goal></goals>\n"
                   . "                                </execution>\n"
                   . "                        </executions>\n"
                   . "                </plugin>\n"
                   . "                <!-- test-order-plugin-end -->\n";
              $done = 1;
            }
          ' $MODULE/pom.xml

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download tier files from tier 1
        uses: actions/download-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: ${{ env.MODULE }}/target/

      - name: Run tier 3 (remaining tests)
        run: mvn $MVN_ARGS test-order:run-tier test -pl $MODULE -Dtestorder.tiered.currentTier=3
