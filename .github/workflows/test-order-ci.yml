name: "test-order: Three-Tier CI"

# Three-tier test ordering for the connectivity-destination-service module.
#   Tier 1: change-affected tests — every PR/push (skipped silently if no index)
#   Tier 2: broader coverage — push to main only
#   Tier 3: remaining tests   — nightly + manual dispatch
#
# When no learn index can be downloaded, all tiers skip silently and exit
# success. The daily scheduled job in test-order-learn.yml refreshes the
# index; on first run / if missing, this workflow also dispatches the learn
# workflow so a future CI run has an index available.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 2 * * *"   # nightly for tier 3
  workflow_dispatch:

env:
  MODULE: cloudplatform/connectivity-destination-service
  MVN_ARGS: --batch-mode --no-transfer-progress -DskipFormatting -Denforcer.skip
  INDEX_PATH: cloudplatform/connectivity-destination-service/.test-order/test-dependencies.lz4

permissions:
  contents: read
  actions: write   # needed for dispatching test-order-learn.yml on first run

jobs:

  # ── Tier 1: download index + run affected tests (skip if no index) ───────────
  tier-1:
    name: "Tier 1 — Affected Tests"
    runs-on: ubuntu-latest
    outputs:
      has_index: ${{ steps.check_index.outputs.has_index }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Try to download learn index
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn $MVN_ARGS test-order:download -pl $MODULE

      - name: Check whether an index is available
        id: check_index
        run: |
          if [[ -s "$INDEX_PATH" ]]; then
            echo "has_index=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Learn index found ($(stat -c%s "$INDEX_PATH") bytes) — running tier 1."
          else
            echo "has_index=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No learn index available — skipping all tiers. The nightly learn job will produce one."
          fi

      - name: Trigger learn workflow if no index (first run)
        if: steps.check_index.outputs.has_index == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice::No index found — kicking off Learn Pass workflow."
          gh workflow run test-order-learn.yml --ref main || true

      - name: Run tier 1 (affected)
        if: steps.check_index.outputs.has_index == 'true'
        run: mvn $MVN_ARGS test-order:tiered-select test -pl $MODULE -Dmaven.test.failure.ignore=true

      - name: Upload tier files for downstream jobs
        if: steps.check_index.outputs.has_index == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: |
            ${{ env.MODULE }}/target/test-order-tier2.txt
            ${{ env.MODULE }}/target/test-order-tier3.txt
          retention-days: 1
          if-no-files-found: ignore

  # ── Tier 2: broader coverage (push to main only) ─────────────────────────────
  tier-2:
    name: "Tier 2 — Broader Coverage"
    needs: tier-1
    if: success() && needs.tier-1.outputs.has_index == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download tier files from tier 1
        uses: actions/download-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: ${{ env.MODULE }}/target/

      - name: Run tier 2 (broader coverage)
        if: hashFiles(format('{0}/target/test-order-tier2.txt', env.MODULE)) != ''
        run: mvn $MVN_ARGS test-order:run-tier test -pl $MODULE -Dtestorder.tiered.currentTier=2

  # ── Tier 3: remaining tests (nightly, after tier 1) ──────────────────────────
  tier-3:
    name: "Tier 3 — Remaining Tests"
    needs: tier-1
    if: success() && needs.tier-1.outputs.has_index == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download tier files from tier 1
        uses: actions/download-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: ${{ env.MODULE }}/target/

      - name: Run tier 3 (remaining tests)
        if: hashFiles(format('{0}/target/test-order-tier3.txt', env.MODULE)) != ''
        run: mvn $MVN_ARGS test-order:run-tier test -pl $MODULE -Dtestorder.tiered.currentTier=3
