name: "test-order: Three-Tier CI"

# Three-tier test ordering for the connectivity-destination-service module.
#   Tier 1: change-affected tests (or full learn pass if no index) — every PR/push
#   Tier 2: broader coverage — push to main only
#   Tier 3: remaining tests   — nightly + manual dispatch
#
# When no learn index exists, tier-1 falls back to a full learn pass and uploads
# the resulting index as the artifact for the test-order-learn workflow to consume.
# A daily scheduled job in test-order-learn.yml refreshes the index.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "30 2 * * *"   # nightly for tier 3
  workflow_dispatch:

env:
  MODULE: cloudplatform/connectivity-destination-service
  MVN_ARGS: --batch-mode --no-transfer-progress -DskipFormatting -Denforcer.skip

permissions:
  contents: read
  actions: read

jobs:

  # ── Tier 1: download index (or learn locally) + run affected tests ───────────
  tier-1:
    name: "Tier 1 — Affected Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download learn index (or fall back to local learn pass)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn $MVN_ARGS test-order:download -pl $MODULE \
            -Dtestorder.download.fallbackToLearn=true

      - name: Run tier 1 (affected) — or learn pass if mode flipped to learn
        run: mvn $MVN_ARGS test-order:tiered-select test -pl $MODULE -Dmaven.test.failure.ignore=true

      - name: Aggregate learn data (no-op if index was downloaded)
        run: mvn $MVN_ARGS test-order:aggregate -pl $MODULE

      - name: Upload tier files for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: |
            ${{ env.MODULE }}/target/test-order-tier2.txt
            ${{ env.MODULE }}/target/test-order-tier3.txt
          retention-days: 1
          if-no-files-found: ignore

  # ── Tier 2: broader coverage (push to main only) ─────────────────────────────
  tier-2:
    name: "Tier 2 — Broader Coverage"
    needs: tier-1
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download tier files from tier 1
        uses: actions/download-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: ${{ env.MODULE }}/target/

      - name: Skip if no tier-2 file (tier-1 ran learn pass instead)
        id: check
        run: |
          if [[ -s "$MODULE/target/test-order-tier2.txt" ]]; then
            echo "has_tier=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tier=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tier-2 file — tier-1 likely ran a learn pass. Skipping tier-2."
          fi

      - name: Run tier 2 (broader coverage)
        if: steps.check.outputs.has_tier == 'true'
        run: mvn $MVN_ARGS test-order:run-tier test -pl $MODULE -Dtestorder.tiered.currentTier=2

  # ── Tier 3: remaining tests (nightly, after tiers 1+2) ───────────────────────
  tier-3:
    name: "Tier 3 — Remaining Tests"
    needs: tier-2
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Download tier files from tier 1
        uses: actions/download-artifact@v4
        with:
          name: tier-files-${{ github.sha }}
          path: ${{ env.MODULE }}/target/

      - name: Skip if no tier-3 file (tier-1 ran learn pass instead)
        id: check
        run: |
          if [[ -s "$MODULE/target/test-order-tier3.txt" ]]; then
            echo "has_tier=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tier=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tier-3 file — tier-1 likely ran a learn pass. Skipping tier-3."
          fi

      - name: Run tier 3 (remaining tests)
        if: steps.check.outputs.has_tier == 'true'
        run: mvn $MVN_ARGS test-order:run-tier test -pl $MODULE -Dtestorder.tiered.currentTier=3
