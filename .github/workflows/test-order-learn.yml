name: Learn Pass

on:
  push:
    paths:
      - 'cloudplatform/connectivity-destination-service/src/**'
      - '.github/workflows/test-order-learn.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  learn:
    name: Learn Pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build module (skip tests)
        run: mvn install -DskipTests -pl cloudplatform/connectivity-destination-service -am -q

      - name: Run learn pass (writes fallback)
        run: |
          mvn test \
            -pl cloudplatform/connectivity-destination-service \
            -Dtestorder.mode=learn \
            -Dmaven.test.failure.ignore=true \
            -q || true

      - name: Aggregate (merges fallback into index)
        run: mvn test-order:aggregate -pl cloudplatform/connectivity-destination-service -q || true

      - name: Locate and stage learn index
        run: |
          set -e
          ROOT_DIR=.test-order
          MODULE_DIR=cloudplatform/connectivity-destination-service/.test-order
          STAGE=staged-test-order
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Copy whichever .test-order dir has data (root if both exist, then module)
          if [[ -d "$ROOT_DIR" ]]; then
            echo "Found root .test-order:"
            ls -la "$ROOT_DIR"
            cp -r "$ROOT_DIR"/. "$STAGE"/ 2>/dev/null || true
          fi
          if [[ -d "$MODULE_DIR" ]]; then
            echo "Found module .test-order:"
            ls -la "$MODULE_DIR"
            cp -rn "$MODULE_DIR"/. "$STAGE"/ 2>/dev/null || true
          fi

          # If we have a fallback file but no merged index yet, run aggregate from
          # whichever directory has the fallback so it gets merged.
          if ls "$STAGE"/*.collector-fallback 2>/dev/null; then
            echo "Fallback file present — running aggregate from staged dir"
            mkdir -p "$MODULE_DIR"
            cp -f "$STAGE"/*.collector-fallback "$MODULE_DIR"/ 2>/dev/null || true
            mvn test-order:aggregate -pl cloudplatform/connectivity-destination-service -q || true
            cp -f "$MODULE_DIR"/test-dependencies.lz4 "$STAGE"/ 2>/dev/null || true
            rm -f "$STAGE"/*.collector-fallback
          fi

          echo ""
          echo "Final staged contents:"
          ls -la "$STAGE"
          if [[ ! -f "$STAGE/test-dependencies.lz4" ]]; then
            echo "::error::No test-dependencies.lz4 produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$STAGE/test-dependencies.lz4")
          echo "Index size: $SIZE bytes"

      - name: Upload learn index
        uses: actions/upload-artifact@v4
        with:
          name: test-order-deps
          path: staged-test-order/
          include-hidden-files: true
          retention-days: 90
