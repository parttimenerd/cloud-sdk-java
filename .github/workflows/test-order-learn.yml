name: "test-order: Learn Pass"

# Runs the test-order learn pass for the connectivity-destination-service module
# and uploads the resulting index as a workflow artifact so developers can
# download it with: mvn test-order:download
#
# NOTE: Demo fork for SAP DCOM 2026 "You Are Running the Wrong Tests First".

on:
  push:
    branches: [ "main" ]
    paths:
      - "cloudplatform/connectivity-destination-service/src/**"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 3am — keep index fresh

env:
  MODULE: cloudplatform/connectivity-destination-service
  PLUGIN_VERSION: 0.0.1-SNAPSHOT
  MVN_ARGS: --batch-mode --no-transfer-progress -DskipFormatting -Denforcer.skip
  OSSRH: https://central.sonatype.com/repository/maven-snapshots/

permissions:
  contents: read
  actions: write

jobs:
  learn:
    name: "Learn Pass"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'XML'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Enable test-order plugin in pom.xml
        run: |
          perl -i -pe '
            if (/^\s+<plugins>\s*$/ && !$done) {
              $_ .= "                <!-- test-order-plugin-start -->
"
                   . "                <plugin>
"
                   . "                        <groupId>me.bechberger</groupId>
"
                   . "                        <artifactId>test-order-maven-plugin</artifactId>
"
                   . "                        <version>'"$PLUGIN_VERSION"'</version>
"
                   . "                        <executions>
"
                   . "                                <execution>
"
                   . "                                        <goals><goal>prepare</goal></goals>
"
                   . "                                </execution>
"
                   . "                        </executions>
"
                   . "                </plugin>
"
                   . "                <!-- test-order-plugin-end -->
";
              $done = 1;
            }
          ' $MODULE/pom.xml

      - name: Run learn pass
        run: |
          mvn $MVN_ARGS test -pl $MODULE \
            -Dtestorder.mode=learn \

            -Dmaven.test.failure.ignore=true

      - name: Aggregate learn data
        run: mvn $MVN_ARGS test-order:aggregate -pl $MODULE

      - name: Upload learn index
        uses: actions/upload-artifact@v4
        with:
          name: test-order-deps
          path: ${{ env.MODULE }}/.test-order/
          retention-days: 90
          if-no-files-found: error
