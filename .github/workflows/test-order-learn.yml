name: Learn Pass

on:
  push:
    paths:
      - 'cloudplatform/connectivity-destination-service/src/**'
      - '.github/workflows/test-order-learn.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  learn:
    name: Learn Pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build module (skip tests)
        run: mvn install -DskipTests -pl cloudplatform/connectivity-destination-service -am -q

      - name: Run learn pass
        run: |
          mvn test \
            -pl cloudplatform/connectivity-destination-service \
            -Dtestorder.mode=learn \
            -Dmaven.test.failure.ignore=true \
            -q

      - name: Aggregate learn data
        run: mvn test-order:aggregate -pl cloudplatform/connectivity-destination-service -q

      - name: Upload learn index
        uses: actions/upload-artifact@v4
        with:
          name: test-order-deps
          path: .test-order/
          include-hidden-files: true
          retention-days: 90
