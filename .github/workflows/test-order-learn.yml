name: Learn Pass

on:
  push:
    paths:
      - 'cloudplatform/connectivity-destination-service/src/**'
      - '.github/workflows/test-order-learn.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  learn:
    name: Learn Pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Add OSSRH snapshot repository
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>ossrh-snapshots</id>
                <repositories>
                  <repository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>ossrh-snapshots</id>
                    <url>https://central.sonatype.com/repository/maven-snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>ossrh-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build module (skip tests)
        run: mvn install -DskipTests -pl cloudplatform/connectivity-destination-service -am -q

      - name: Run learn pass + aggregate (single invocation persists merged index)
        run: |
          mvn test-order:learn test test-order:aggregate \
            -pl cloudplatform/connectivity-destination-service \
            -Dmaven.test.failure.ignore=true \
            -q

      - name: Verify index is populated
        run: |
          INDEX=cloudplatform/connectivity-destination-service/.test-order/test-dependencies.lz4
          if [[ ! -f "$INDEX" ]]; then
            echo "::error::Index file not found at $INDEX"
            exit 1
          fi
          SIZE=$(stat -c%s "$INDEX")
          echo "Index size: $SIZE bytes"
          if [[ "$SIZE" -lt 5000 ]]; then
            echo "::warning::Index is unexpectedly small ($SIZE bytes) — fallback may not have been merged"
            ls -la cloudplatform/connectivity-destination-service/.test-order/
          fi

      - name: Upload learn index
        uses: actions/upload-artifact@v4
        with:
          name: test-order-deps
          path: cloudplatform/connectivity-destination-service/.test-order/
          include-hidden-files: true
          retention-days: 90
