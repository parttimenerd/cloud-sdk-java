name: "test-order: Learn Pass"

# Runs the test-order learn pass for the connectivity-destination-service module
# and uploads the resulting index as a workflow artifact so developers can
# download it with: mvn test-order:download
#
# NOTE: Demo fork for SAP DCOM 2026 "You Are Running the Wrong Tests First".

on:
  push:
    branches: [ "main" ]
    paths:
      - "cloudplatform/connectivity-destination-service/src/**"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 3am — keep index fresh

env:
  MODULE: cloudplatform/connectivity-destination-service
  MVN_ARGS: --batch-mode --no-transfer-progress -DskipFormatting -Denforcer.skip

permissions:
  contents: read
  actions: write

jobs:
  learn:
    name: "Learn Pass"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: sapmachine
          cache: maven

      - name: Build and install test-order plugin from source
        run: |
          git clone --depth 1 https://github.com/parttimenerd/test-order.git /tmp/test-order
          mvn $MVN_ARGS -f /tmp/test-order/pom.xml install -DskipTests \
            -pl test-order-maven-plugin -am -q

      - name: Build module (skip tests)
        run: mvn $MVN_ARGS install -DskipTests -pl $MODULE -am

      - name: Run learn pass
        run: |
          mvn $MVN_ARGS test -pl $MODULE \
            -Dtestorder.mode=learn \
            -Dmaven.test.failure.ignore=true

      - name: Aggregate learn data
        run: mvn $MVN_ARGS test-order:aggregate -pl $MODULE

      - name: Upload learn index
        uses: actions/upload-artifact@v4
        with:
          name: test-order-deps
          path: ${{ env.MODULE }}/.test-order/
          retention-days: 90
          if-no-files-found: error
